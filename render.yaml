services:
  - type: web
    name: fyloq
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4

      - key: APP_ENV
        value: production

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD_HASH
        sync: false

      - key: SUPABASE_DB_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: fyloq-files